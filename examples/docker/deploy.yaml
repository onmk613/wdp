# docker 部署相位（独立 chart，主机组 docker）。
#
# 用法：
#   wdp run test/docker -i test/inventory.yaml                    # 部署（制品 cache-first：packages/ 已有则零联网，未命中下载一次落缓存）
#   wdp run test/docker -i test/inventory.yaml --check --diff     # 零风险预演
#   wdp run test/docker -i test/inventory.yaml --phase download   # 仅准备离线制品（控制机 packages/，可离线执行）
#   打包：wdp package test/docker → docker-1.0.0.tgz（制品先 --phase download 备好，包内自带即纯离线安装）

- name: 采集节点 facts
  hosts: docker
  tasks:
    - name: 采集 facts（架构判定；--tags download 时同样执行）
      setup:
      tags: [download]

- name: 安装 docker（官方静态包）
  hosts: docker
  become: true
  tasks:
    # 控制机侧：预下载官方静态包与 cli 插件到 packages/<arch>/（幂等，制品
    # 齐全时零下载）——避免多主机并发时重复下载；--tags download 可单独触发
    - name: 准备 packages 离线制品
      include: tasks/download.yaml
      tags: [download]
      delegate_to: localhost
      run_once: true

    - name: 不支持的架构直接失败（仅 x86_64 / aarch64）
      shell: 'echo "unsupported architecture: {{ .arch }}" >&2; exit 1'
      when: '{{ if eq (include "docker.arch_alias" .) "unsupported" }}yes{{ else }}no{{ end }}'

    - name: 配置目录（daemon.json 与 cli 插件）
      file:
        path: "{{ .item }}"
        state: directory
        mode: "0755"
      loop: ['{{ .conf_dir }}', '{{ .cli_plugins_dir }}']

    # ---------- 制品分发：artifact cache-first，单一任务统一在线/离线 ----------
    # 控制机 packages/<arch>/ 已有制品（--phase download 预置 / tgz 离线包自带）
    # 则零联网直接分发；未命中则控制端下载一次落缓存（全部主机复用）再分发。
    # members 按文件名在官方静态包内检索二进制（kubernetes/etcd 发布包同理），
    # 拍平落位 dest，权限沿用归档条目（此处显式 0755）。
    - name: 分发 docker 二进制（含内嵌 containerd）
      artifact:
        url: "{{ .download_base }}/{{ .arch }}/docker-{{ .version }}.tgz"
        cache: "packages/{{ .arch }}/docker-{{ .version }}.tgz"
        members: [containerd, containerd-shim-runc-v2, ctr, docker, docker-init, docker-proxy, dockerd, runc]
        dest: "{{ .bin_dir }}"
        mode: "0755"

    - name: 分发 docker compose 插件（release 名用 x86_64 风格架构）
      artifact:
        url: "https://github.com/docker/compose/releases/download/{{ .compose_version }}/docker-compose-linux-{{ .arch }}"
        cache: "packages/{{ .arch }}/docker-compose"
        dest: "{{ .cli_plugins_dir }}/docker-compose"
        mode: "0755"

    - name: 分发 docker buildx 插件（release 名用 Go 风格架构）
      artifact:
        url: 'https://github.com/docker/buildx/releases/download/{{ .buildx_version }}/buildx-{{ .buildx_version }}.linux-{{ include "docker.arch_alias" . }}'
        cache: "packages/{{ .arch }}/docker-buildx"
        dest: "{{ .cli_plugins_dir }}/docker-buildx"
        mode: "0755"

    # ---------- 配置与服务（变更 → notify 重启） ----------
    - name: 渲染 daemon.json
      template:
        src: templates/daemon.json.tpl
        dest: "{{ .conf_dir }}/daemon.json"
        mode: "0644"
      notify: 重启 docker

    - name: 部署 docker 单元并启动
      systemd_unit:
        name: docker.service
        src: templates/docker.service.tpl
        state: started
        enabled: true
      notify: 重启 docker

  handlers:
    - name: 重启 docker
      service:
        name: docker
        state: restarted
