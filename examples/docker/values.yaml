# docker chart 默认值。覆盖途径：-f envs/*.yaml → --set。
online_install: true        # true 在线下载官方静态包；false 用 packages/<arch>/ 离线制品
version: "29.3.0"           # docker 静态包版本（在线模式）
compose_version: "v5.1.1"   # docker compose 插件版本（在线模式）
buildx_version: "v0.33.0"   # docker buildx 插件版本（在线模式）

download_base: "https://download.docker.com/linux/static/stable"
cli_plugins_dir: /usr/local/lib/docker/cli-plugins

data_dir: /var/lib          # data-root = <data_dir>/docker（inventory 主机变量 docker_data_dir 优先生效）
bin_dir: /usr/bin
conf_dir: /etc/docker
staging_dir: /tmp/wdp-docker-dist   # 在线模式解包暂存（tgz 内含 docker/ 前缀目录）

# daemon.json 内容（模板渲染，改动触发 docker 重启）
log:
  driver: json-file
  level: warn
  max_size: 50m
  max_file: 5

uninstall_remove_binaries: false   # 卸载时是否删二进制与数据目录（不可逆）
