# 子 chart：单 play；hosts/become 继承父 play
# 作用域隔离：只看到 父values的 common 子树 + global + 引用 vars
- hosts: all
  tasks:
    - name: 基础组件就绪（可选参数用 dig：缺键时取默认值，不受严格模式影响）
      shell: 'echo "component={{ .component }} home={{ .home }} mirror={{ dig "mirror" "builtin" . }}"'

    - name: 组件指纹
      shell: 'mkdir -p {{ .home }} && echo "{{ .component }}@{{ .global.env }}" > {{ .home }}/VERSION'
