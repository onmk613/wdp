# wdp CI：质量门禁（build/vet/gofmt/tidy/race/coverage/golangci-lint）+ 安全扫描。
# 对含 CA/SSH/root-agent 原语的工具，govulncheck 与回归测试是硬性要求。
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt（输出差异即失败）
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy（产生差异即失败）
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum 与代码不同步，请运行 go mod tidy"
            exit 1
          fi

      - name: Test（含竞态检测 + 覆盖率）
        run: |
          set -o pipefail
          status=0
          go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./... 2>&1 | tee /tmp/wdp-test.log || status=$?
          if [ "$status" -ne 0 ]; then
            # 失败详情输出为 annotation（公开仓库匿名可读，便于定位）
            grep -E -A4 '^--- FAIL|^panic|DATA RACE' /tmp/wdp-test.log | head -80 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line:0:250}"
            done
            exit "$status"
          fi

      # 覆盖率门槛：低于 60% 视为回归（当前基线 ~64%）。门槛随测试补齐上调，
      # 只防"新增大量未测代码"，不追求数字。
      - name: Coverage gate（>= 60%）
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "total coverage: ${total}%"
          if awk -v t="$total" 'BEGIN { exit !(t+0 < 60) }'; then
            echo "::error::覆盖率 ${total}% 低于门槛 60%"
            exit 1
          fi

      - name: 示例 chart lint（examples/ 是文档承诺的可运行样例）
        run: |
          for c in examples/docker examples/node-exporter; do
            go run ./cmd/wdp lint "./$c"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

      - name: golangci-lint（配置见 .golangci.yml）
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1 run

  # build.sh 是唯一构建入口且缺省走全平台交叉编译：多架构 bin 目录是
  # push 自举 / agentctl install 同级查找的分发单元，默认路径必须有门禁。
  build-script:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build.sh --help（无输出即失败）
        run: |
          ./build.sh --help | tee /tmp/help.txt
          grep -q '用法:' /tmp/help.txt

      - name: build.sh 缺省全平台构建（bin 目录分发单元）
        run: |
          ./build.sh
          test -x bin/wdp-linux-amd64
          test -x bin/wdp-linux-arm64
          test -x bin/wdp-darwin-arm64
          test -f bin/wdp-windows-amd64.exe
          test -s bin/SHA256SUMS

      - name: 全集产物可用（--version 冒烟）
        run: ./bin/wdp-linux-amd64 --version

  # 多平台编译矩阵：控制端支持 macOS/Windows，交叉编译必须在 CI 验证
  #（单元测试仍只在 linux 跑，避免把平台差异带进断言）。
  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux/arm64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross build ${{ matrix.target }}
        run: |
          os=${TARGET%/*}; arch=${TARGET#*/}
          CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o /tmp/wdp-$os-$arch ./cmd/wdp
        env:
          TARGET: ${{ matrix.target }}

  # jsonv2 观察位：GOEXPERIMENT=jsonv2 下 v1 encoding/json 由 v2 引擎重实现
  # （v1 API 输出字节兼容，本地已实测：HTML 转义/map 排序/浮点/大小写折叠一致）。
  # golden 逐字节对比、plan 确定性编译、marker digest 等以 Marshal 输出为口径的
  # 测试在此验证跨引擎一致性；实验转正或行为清单变化时（Go 版本升级需复核）
  # 此位第一时间暴露。默认引擎的结论仍以 check job 为准。
  jsonv2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build（jsonv2 引擎）
        run: go build ./...

      - name: Test（jsonv2 引擎，含竞态检测）
        run: go test -race -count=1 ./...

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 版本锁定：@latest 会让扫描行为随上游发布漂移（且供应链上不可复现）
      - name: Govulncheck（已知漏洞扫描）
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./...
