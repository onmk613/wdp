name: ci

on:
  push:
    # web-console 是活跃开发分支（Web 管理端主体在此演进），直推同样要过
    # CI——此前直推不触发，叠加 [skip ci] 习惯会让该分支长期没有 CI 信号
    branches: [main, web-console]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum 与代码不同步，请运行 go mod tidy"
            exit 1
          fi
      - name: golangci-lint（配置见 .golangci.yml）
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1 run

      # cmd/wdp-agent/deps_test.go 的依赖边界断言也在 ./... 里一并执行
      - name: Test
        run: |
          set -o pipefail
          status=0
          go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./... 2>&1 | tee /tmp/wdp-test.log || status=$?
          if [ "$status" -ne 0 ]; then
            # 失败详情输出为 annotation（公开仓库匿名可读，便于定位）
            grep -E -A4 '^--- FAIL|^panic|DATA RACE' /tmp/wdp-test.log | head -80 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line:0:250}"
            done
            exit "$status"
          fi

      # 覆盖率门槛：低于 60% 视为回归（当前基线 ~64%）。门槛随测试补齐上调，
      # 只防"新增大量未测代码"，不追求数字。
      - name: Coverage gate（>= 60%）
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "total coverage: ${total}%"
          if awk -v t="$total" 'BEGIN { exit !(t+0 < 60) }'; then
            echo "::error::覆盖率 ${total}% 低于门槛 60%"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./...

  # jsonv2 观察位：GOEXPERIMENT=jsonv2 下 v1 encoding/json 由 v2 引擎重实现
  # （v1 API 输出字节兼容，本地已实测：HTML 转义/map 排序/浮点/大小写折叠一致）。
  # golden 逐字节对比、plan 确定性编译、marker digest 等以 Marshal 输出为口径的
  # 测试在此验证跨引擎一致性；实验转正或行为清单变化时（Go 版本升级需复核）
  # 此位第一时间暴露。默认引擎的结论仍以 check job 为准。
  jsonv2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build（jsonv2 引擎）
        run: go build ./...

      - name: Test（jsonv2 引擎，含竞态检测）
        run: go test -race -count=1 ./...

  # build.sh 是唯一构建入口且缺省走全平台交叉编译（full + agent 两档 ×
  # 5 平台）：多架构 bin 目录是纳管脚本同级查找的分发单元，默认路径必须
  # 有门禁；--frontend 额外构建 frontend/（Vite + Vue 3）并经 go:embed
  # 内嵌控制台。全平台交叉编译在此一并验证，无需单列 cross-build 矩阵。
  build-script:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: build.sh --help（无输出即失败）
        run: |
          ./build.sh --help | tee /tmp/help.txt
          grep -q '用法:' /tmp/help.txt

      - name: 前端类型检查 + lint + 单测
        run: |
          cd frontend
          npm ci --no-fund --no-audit
          npm run typecheck
          npm run lint
          npm run test

      - name: build.sh 缺省全平台构建 + 前端内嵌（full + agent 两档）
        run: |
          ./build.sh --frontend
          test -x bin/wdp-linux-amd64
          test -x bin/wdp-linux-arm64
          test -x bin/wdp-darwin-amd64
          test -x bin/wdp-darwin-arm64
          test -f bin/wdp-windows-amd64.exe
          test -x bin/wdp-agent-linux-amd64
          test -x bin/wdp-agent-linux-arm64
          test -s bin/SHA256SUMS
          test -f internal/web/static/index.html

      - name: 产物冒烟（--version / 两档命令面）
        run: |
          ./bin/wdp-linux-amd64 --version | grep -q 'tier full'
          # 全量档控制端命令面（server/ca/module…）
          ./bin/wdp-linux-amd64 server --help >/dev/null
          ./bin/wdp-linux-amd64 ca --help >/dev/null
          ./bin/wdp-linux-amd64 module >/dev/null
          # 瘦 agent 档命令形态与全量档同构（纳管脚本/systemd 按 <bin> agent 调用）
          ./bin/wdp-agent-linux-amd64 --version | grep -q 'tier agent'
          ./bin/wdp-agent-linux-amd64 agent --help >/dev/null
          ./bin/wdp-agent-linux-amd64 agent gencsr --help >/dev/null

      # 两档即全部产物面（原 --tier cli / --tier console 已删除，见 build.sh
      # 头部档位说明）：钉住被删档位确实不再可选——防有人把 tier_tags 那套
      # 机制加回来而又没有消费方。
      - name: 已删档位不可达
        run: |
          for t in cli console; do
            if ./build.sh --tier "$t" linux/amd64 2>/dev/null; then
              echo "::error::--tier $t 已被删除，此处应报错而非构建成功"
              exit 1
            fi
          done
